<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumina Studio</title>
<style>
:root{--green:#6b7d65;--light:#e6ede4;--bg:#f7f5f1;--ink:#292c2a;--muted:#7d857c;--line:#dedbd5;--card:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;margin-bottom:28px}.brand span{width:34px;height:34px;border-radius:12px;background:var(--light);display:grid;place-items:center}.nav button{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:10px;background:transparent;margin:3px 0;color:#454b46}.nav button.active,.nav button:hover{background:var(--light);color:var(--green);font-weight:600}.main{padding:28px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.top h1{margin:0;font-size:28px;font-weight:500}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:10px 14px;border-radius:10px;background:var(--green);color:#fff}.btn.secondary{background:#fff;color:var(--green);border:1px solid var(--line)}.btn.danger{background:#a34d55}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 8px #00000008}.stat{font-size:30px;margin:6px 0}.muted{color:var(--muted)}.toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:14px}.list{display:grid;gap:10px}.row{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff}.thumb{width:56px;height:56px;border-radius:12px;background:var(--light);display:grid;place-items:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:12px;color:var(--muted)}input,textarea,select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}textarea{min-height:110px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.editor{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.preview{position:sticky;top:20px}.phone{max-width:360px;margin:auto;background:#fff;border:8px solid #222;border-radius:32px;overflow:hidden;min-height:640px;box-shadow:0 20px 40px #0002}.phonebar{height:30px;background:#222}.phonebody{padding:18px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--light);color:var(--green);font-size:11px}.check{display:flex;align-items:center;gap:8px;margin:8px 0}.check input{width:auto}.empty{padding:36px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:20px;z-index:10}.modalbox{background:#fff;border-radius:18px;padding:20px;width:min(650px,100%);max-height:90vh;overflow:auto}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.main{padding:18px}.grid,.formgrid,.editor{grid-template-columns:1fr}.preview{position:static}}

/* Visual Layout Editor v1 */
.layout-editor{display:grid;grid-template-columns:240px minmax(360px,1fr) 300px;gap:14px;min-height:700px}
.layout-panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;overflow:auto}
.layout-panel h3{margin:0 0 10px;font-size:15px}
.screen-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.screen-tab{padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
.screen-tab.active{background:var(--light);color:var(--green);font-weight:700}
.component-list{display:grid;gap:6px}
.component-item{display:grid;grid-template-columns:1fr auto;gap:5px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:9px;background:#fff}
.component-item.active{outline:2px solid var(--green);background:var(--light)}
.component-item button{padding:5px 7px;border-radius:7px;background:#fff;border:1px solid var(--line)}
.canvas-wrap{display:grid;place-items:center;background:#eeeae4;border:1px solid var(--line);border-radius:16px;padding:20px;overflow:auto}
.layout-canvas{position:relative;width:360px;height:640px;background:#fff;border:8px solid #222;border-radius:30px;overflow:hidden;box-shadow:0 16px 35px #0002}
.canvas-grid{position:absolute;inset:0;background-image:linear-gradient(#00000008 1px,transparent 1px),linear-gradient(90deg,#00000008 1px,transparent 1px);background-size:20px 20px;pointer-events:none}
.layout-node{position:absolute;box-sizing:border-box;cursor:grab;user-select:none;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.layout-node.selected{outline:2px solid var(--green);outline-offset:2px;z-index:20}
.layout-node .resize{position:absolute;right:0;bottom:0;width:12px;height:12px;background:var(--green);border-radius:3px 0 0 0;cursor:nwse-resize}
.layout-node-text{padding:8px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.layout-actions{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.layout-actions .btn{padding:7px 9px;font-size:12px}
.inspector-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inspector-grid .field{margin:4px 0}
.layout-hint{font-size:12px;color:var(--muted);line-height:1.45}
@media(max-width:1100px){.layout-editor{grid-template-columns:210px 1fr}.layout-panel.inspector{grid-column:1/-1}}
@media(max-width:760px){.layout-editor{grid-template-columns:1fr}.canvas-wrap{order:-1}.layout-panel.inspector{grid-column:auto}}
</style><style id="lumina-visual-effects-css">.visual-bg{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:inherit}.visual-bg-img{position:absolute;inset:0;width:100%;height:100%}.visual-bg-overlay{position:absolute;inset:0}.layout-node-text{position:relative;z-index:2}.visual-effect-help{font-size:11px;color:var(--muted);line-height:1.35}.inspector input[type=color]{appearance:none;-webkit-appearance:none;width:100%;height:40px;padding:4px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer}.inspector input[type=color]::-webkit-color-swatch-wrapper{padding:0}.inspector input[type=color]::-webkit-color-swatch{border:0;border-radius:6px}.inspector input[type=color]::-moz-color-swatch{border:0;border-radius:6px}.inspector-section{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}</style></head>
<body><div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const seed={version:1,app:{name:'Lumina',version:'1.0.0',theme:{primary:'#6B7D65',background:'#F9F7F4'},navigation:['home','evolution','journeys','events','sophia','profile']},audios:[
{id:'sono',title:'Sono Profundo',subtitle:'Áudio para dormir melhor',duration:'45 min',free:true,enabled:true,image:'sono.jpg',audioUrl:''},
{id:'ansiedade',title:'Libertar Ansiedade',subtitle:'Suaviza a mente e o corpo',duration:'20 min',free:true,enabled:true,image:'ansiedade.jpg',audioUrl:''},
{id:'autoestima',title:'Autoestima Serena',subtitle:'Fortalece a confiança interior',duration:'15 min',free:true,enabled:true,image:'autoestima.jpg',audioUrl:''},
{id:'habitos',title:'Hábitos Diários',subtitle:'Reforça rotinas positivas',duration:'10 min',free:true,enabled:true,image:'habitos.jpg',audioUrl:''},
{id:'profundidade',title:'Profundidade Interior',subtitle:'Conexão e silêncio interior',duration:'30 min',free:true,enabled:true,image:'profundidade.jpg',audioUrl:''},
{id:'despertar',title:'Despertar Calmo',subtitle:'Comece o dia com leveza',duration:'12 min',free:true,enabled:true,image:'despertar.jpg',audioUrl:''}],
courses:[{id:'hipnose',title:'Hipnose & Regressão',description:'Trabalho profundo com o inconsciente.',price:147,published:true},{id:'humanista',title:'Mentoria Humanista',description:'Acompanhamento para propósito e missão.',price:197,published:true}],
journeys:[{id:'sono',title:'Jornada do Sono Profundo',description:'Respirações e práticas para noites mais profundas.',days:7,price:47,published:true},{id:'ansiedade',title:'Libertar a Ansiedade',description:'Ferramentas suaves para acalmar a mente.',days:12,price:67,published:true}],
events:[],pages:[{id:'home',title:'Início',body:'Bem-vindo à Lumina.'}],layout:{home:{contentWidth:720,audioColumnsPhone:1,audioColumnsTablet:2,showMood:true,showGreeting:true},cards:{radius:18,imageRatio:'16:9'}},media:[]};
const DEFAULT_SUPABASE_URL='https://hwryastsiwbwbnvijzdf.supabase.co';
const DEFAULT_SUPABASE_KEY='sb_publishable__j_zADdqd6rajMeYk6-20A_PnqsV6Jc';
let db=JSON.parse(localStorage.getItem('luminaStudio')||'null')||seed;let state={section:'dashboard',edit:null};
let cloud={url:localStorage.getItem('luminaSupabaseUrl')||DEFAULT_SUPABASE_URL,key:localStorage.getItem('luminaSupabaseKey')||DEFAULT_SUPABASE_KEY,client:null,user:null};
function cloudReady(){return !!(cloud.url&&cloud.key&&cloud.client)}
async function initCloud(){if(!cloud.url||!cloud.key)return; try{cloud.client=window.supabase.createClient(cloud.url,cloud.key);const {data}=await cloud.client.auth.getSession();cloud.user=data.session?.user||null; if(cloud.user){await loadCloud();} render();}catch(e){console.error(e);}}
async function loadCloud(){if(!cloudReady())return; const {data,error}=await cloud.client.from('lumina_content').select('content,version,updated_at,published').eq('slug','production').eq('published',true).maybeSingle(); if(error) throw error; if(data?.content){db=data.content;localStorage.setItem('luminaStudio',JSON.stringify(db));}}
async function loginCloud(){const email=prompt('Email do gestor'); if(!email)return; const password=prompt('Password'); if(!password)return; cloud.url=cloud.url.trim();cloud.key=cloud.key.trim();localStorage.setItem('luminaSupabaseUrl',cloud.url);localStorage.setItem('luminaSupabaseKey',cloud.key);cloud.client=window.supabase.createClient(cloud.url,cloud.key);const {data,error}=await cloud.client.auth.signInWithPassword({email,password}); if(error){alert(error.message);return;} cloud.user=data.user; await loadCloud(); render();}
async function logoutCloud(){if(cloud.client)await cloud.client.auth.signOut();cloud.user=null;render()}
async function publishCloud(){if(!cloudReady()||!cloud.user){alert('Liga primeiro o backend e inicia sessão como gestor.');return;} const nextVersion=(Number(db.version)||1)+1;db.version=nextVersion;db.updatedAt=new Date().toISOString();const {error}=await cloud.client.from('lumina_content').update({content:db,version:nextVersion,published:true,updated_at:db.updatedAt,published_at:db.updatedAt}).eq('slug','production');if(error){alert(error.message);return;}await cloud.client.from('lumina_publication_log').insert({admin_user:cloud.user.id,version:nextVersion,summary:'Publicação Lumina Studio'});localStorage.setItem('luminaStudio',JSON.stringify(db));alert('Publicado. As instalações da Lumina passam a receber esta versão na próxima sincronização.');render()}
async function uploadMedia(file){if(!cloudReady()||!cloud.user){alert('Inicia sessão no backend antes de carregar ficheiros.');return null;}const path=`${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const {error}=await cloud.client.storage.from('lumina-media').upload(path,file,{upsert:false});if(error){alert(error.message);return null;}return cloud.client.storage.from('lumina-media').getPublicUrl(path).data.publicUrl}

function save(){localStorage.setItem('luminaStudio',JSON.stringify(db));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nav(){return [['dashboard','Dashboard'],['audios','Áudios grátis'],['courses','Cursos'],['journeys','Jornadas'],['meditations','Meditações diárias'],['pages','Conteúdos'],['events','Eventos'],['layout','Layout'],['media','Media'],['publish','Publicar']].map(([id,l])=>`<button class="${state.section===id?'active':''}" onclick="go('${id}')">${l}</button>`).join('')}
function shell(content){return `<div class="app"><aside class="side"><div class="brand"><span>✦</span>Lumina Studio</div><div class="muted" style="margin-bottom:14px">Gestão da aplicação</div><nav class="nav">${nav()}</nav><div style="margin-top:24px" class="card"><b>Cloud</b><div class="muted" style="margin:6px 0">${cloud.user?'Ligado como '+esc(cloud.user.email):'Não autenticado'}</div>${cloud.user?'<button class="btn secondary" onclick="logoutCloud()">Terminar sessão</button>':'<button class="btn" onclick="loginCloud()">Entrar como gestor</button>'}</div></aside><main class="main">${content}</main></div>`}
function header(title,sub='',buttons=''){return `<div class="top"><div><h1>${title}</h1><div class="muted">${sub}</div></div><div class="actions">${buttons}</div></div>`}
function go(s){state.section=s;state.edit=null;render()}
function dashboard(){return header('Dashboard','Centro de controlo da Lumina',`<button class="btn" onclick="go('publish')">Publicar alterações</button>`)+`<div class="grid"><div class="card"><div class="muted">Áudios</div><div class="stat">${db.audios.length}</div><div class="muted">${db.audios.filter(x=>x.free&&x.enabled).length} gratuitos ativos</div></div><div class="card"><div class="muted">Cursos</div><div class="stat">${db.courses.length}</div><div class="muted">${db.courses.filter(x=>x.published).length} publicados</div></div><div class="card"><div class="muted">Jornadas</div><div class="stat">${db.journeys.length}</div><div class="muted">${db.journeys.filter(x=>x.published).length} publicadas</div></div></div><div class="grid" style="margin-top:14px"><div class="card"><b>Gestão global</b><p class="muted">O Studio é a fonte editorial central. Depois de publicado no backend, todas as instalações sincronizam o mesmo catálogo.</p></div><div class="card"><b>Áudio gratuito</b><p class="muted">Cada áudio tem estado, duração, imagem e URL de áudio. O URL será consumido pela app quando a camada remota estiver ligada.</p></div><div class="card"><b>Layout</b><p class="muted">Controla largura máxima, colunas e visibilidade de componentes. O Android interpreta estes valores responsivamente.</p></div></div>`}
function listSection(type,title,sub,items,fields){let rows=items.map((x,i)=>`<div class="row"><div class="thumb">${x.image?`<img src="${esc(x.image)}">`:'✦'}</div><div><b>${esc(x.title)}</b><div class="muted">${esc(x.subtitle||x.description||'')}</div></div><div class="actions"><button class="btn secondary" onclick="editItem('${type}',${i})">Editar</button><button class="btn danger" onclick="delItem('${type}',${i})">Eliminar</button></div></div>`).join('');return header(title,sub,`<button class="btn" onclick="addItem('${type}')">+ Adicionar</button>`)+`<div class="list">${rows||'<div class="empty">Ainda não existem itens.</div>'}</div>`}
function editItem(type,i){state.edit={type,i,new:i<0?true:false};render()}
function addItem(type){state.edit={type,i:-1,new:true};render()}
function delItem(type,i){if(confirm('Eliminar este item?')){db[type].splice(i,1);save()}}
function editor(){let {type}=state.edit;if(type==='dailyMeditations')return meditationEditor();if(type==='events')return eventEditor();return genericEditor()}
function editorBase(title,sub,x,extra,cancelType){return header(title,sub,`<button class="btn secondary" onclick="go('${cancelType}')">Cancelar</button><button class="btn" onclick="commitEdit()">Guardar</button>`)+`<div class="editor"><div class="card"><div class="field"><label>ID</label><input id="id" value="${esc(x.id)}"></div><div class="field"><label>Título</label><input id="title" value="${esc(x.title)}"></div><div class="field"><label>Subtítulo / descrição curta</label><input id="subtitle" value="${esc(x.subtitle||'')}"></div><div class="field"><label>Descrição / conteúdo</label><textarea id="description">${esc(x.description||x.body||'')}</textarea></div><div class="field"><label>Imagem / URL</label><input id="image" value="${esc(x.image||'')}"></div>${extra}</div><div class="preview"><div class="phone"><div class="phonebar"></div><div class="phonebody"><span class="pill">PREVIEW</span><h2>${esc(x.title)}</h2><p class="muted">${esc(x.subtitle||x.description||'')}</p><div class="card"><b>${esc(x.title)}</b><p class="muted">${esc(x.description||x.body||'Conteúdo')}</p></div></div></div></div></div>`}
function genericEditor(){let {type,i}=state.edit;let x=i>=0?db[type][i]:{id:crypto.randomUUID(),title:'Novo item',subtitle:'',description:'',duration:'',days:7,price:0,free:true,enabled:true,published:false,image:'',audioUrl:''};let title=type==='audios'?'Editar áudio':type==='courses'?'Editar curso':type==='journeys'?'Editar jornada':type==='pages'?'Editar conteúdo':'Editar conteúdo';let extra=type==='audios'?`<div class="formgrid"><div class="field"><label>Duração</label><input id="duration" value="${esc(x.duration)}"></div><div class="field"><label>URL do áudio</label><input id="audioUrl" value="${esc(x.audioUrl)}" placeholder="https://.../audio.mp3"></div></div><label class="check"><input id="free" type="checkbox" ${x.free?'checked':''}> Disponível gratuitamente</label><label class="check"><input id="enabled" type="checkbox" ${x.enabled?'checked':''}> Ativo na app</label>`:type==='courses'?`<div class="field"><label>Preço (€)</label><input id="price" type="number" value="${x.price||0}"></div><label class="check"><input id="published" type="checkbox" ${x.published?'checked':''}> Publicado</label>`:type==='journeys'?`<div class="formgrid"><div class="field"><label>Dias</label><input id="days" type="number" value="${x.days||7}"></div><div class="field"><label>Preço (€)</label><input id="price" type="number" value="${x.price||0}"></div></div><label class="check"><input id="published" type="checkbox" ${x.published?'checked':''}> Publicado</label>`:`<label class="check"><input id="published" type="checkbox" ${x.published!==false?'checked':''}> Publicado</label>`;return editorBase(title,'Editor de conteúdo',x,extra,type)}
function meditationEditor(){let {i}=state.edit;let x=i>=0?db.dailyMeditations[i]:{id:crypto.randomUUID(),date:'',title:'Nova meditação diária',subtitle:'',description:'',image:'',audioUrl:'',enabled:true};let extra=`<div class="formgrid"><div class="field"><label>Data (AAAA-MM-DD)</label><input id="date" type="date" value="${esc(x.date||'')}"></div><div class="field"><label>URL do áudio</label><input id="audioUrl" value="${esc(x.audioUrl||'')}" placeholder="https://.../meditacao.mp3"></div></div><label class="check"><input id="enabled" type="checkbox" ${x.enabled!==false?'checked':''}> Publicada na app</label>`;return editorBase('Editar meditação diária','Planear e publicar a meditação de um dia específico',x,extra,'meditations').replace('>Editor de conteúdo<','>Planear e publicar a meditação de um dia específico<')}
function eventEditor(){let {i}=state.edit;let x=i>=0?db.events[i]:{id:crypto.randomUUID(),title:'Novo evento',subtitle:'',description:'',image:'',published:true};let extra=`<label class="check"><input id="published" type="checkbox" ${x.published!==false?'checked':''}> Publicado</label>`;return editorBase('Editar evento','Eventos, workshops e retiros',x,extra,'events')}
function commitEdit(){let {type,i}=state.edit; if(type==='dailyMeditations' && !db.dailyMeditations) db.dailyMeditations=[]; let old=i>=0?db[type][i]:{};let x={...old,id:document.querySelector('#id').value,title:document.querySelector('#title').value,subtitle:document.querySelector('#subtitle').value,description:document.querySelector('#description').value,image:document.querySelector('#image').value};if(type==='dailyMeditations'){x.date=document.querySelector('#date').value;x.audioUrl=document.querySelector('#audioUrl').value;x.enabled=document.querySelector('#enabled').checked}else if(type==='audios'){x.duration=document.querySelector('#duration').value;x.audioUrl=document.querySelector('#audioUrl').value;x.free=document.querySelector('#free').checked;x.enabled=document.querySelector('#enabled').checked}else if(type==='courses'){x.price=+document.querySelector('#price').value;x.published=document.querySelector('#published').checked}else if(type==='journeys'){x.days=+document.querySelector('#days').value;x.price=+document.querySelector('#price').value;x.published=document.querySelector('#published').checked}else{x.published=document.querySelector('#published').checked}if(type==='pages')x.body=x.description;if(i<0)db[type].push(x);else db[type][i]=x;save()}

const LAYOUT_SCREENS=[
  ['home','Início'],['audios','Áudios'],['courses','Cursos'],['journeys','Jornadas'],['events','Eventos'],['profile','Perfil']
];
const DEFAULT_UI_LAYOUT={
  version:1,

      {id:'home_greeting',type:'text',label:'Saudação',text:'Bom dia',x:20,y:88,w:320,h:42,visible:true,style:{background:'transparent',color:'#292c2a',radius:0,fontSize:24,fontWeight:600}},
      {id:'home_daily',type:'card',label:'Meditação do dia',text:'Meditação do dia',x:16,y:142,w:328,h:150,visible:true,style:{background:'#e6ede4',color:'#292c2a',radius:18,fontSize:18,fontWeight:600}},
      {id:'home_audios',type:'section',label:'Áudios gratuitos',text:'Áudios gratuitos',x:16,y:306,w:328,h:90,visible:true,style:{background:'#ffffff',color:'#292c2a',radius:16,fontSize:16,fontWeight:600}},
      {id:'home_courses',type:'section',label:'Cursos',text:'Cursos',x:16,y:410,w:158,h:90,visible:true,style:{background:'#ffffff',color:'#292c2a',radius:16,fontSize:16,fontWeight:600}},
      {id:'home_journeys',type:'section',label:'Jornadas',text:'Jornadas',x:186,y:410,w:158,h:90,visible:true,style:{background:'#ffffff',color:'#292c2a',radius:16,fontSize:16,fontWeight:600}},
      {id:'home_nav',type:'navigation',label:'Navegação',text:'Início   Evolução   Jornadas   Perfil',x:12,y:566,w:336,h:52,visible:true,style:{background:'#ffffff',color:'#6b7d65',radius:14,fontSize:12,fontWeight:600}}

function ensureUILayout(){
  if(!db.uiLayout) db.uiLayout=JSON.parse(JSON.stringify(DEFAULT_UI_LAYOUT));
  for(const [id] of LAYOUT_SCREENS) if(!db.uiLayout.screens[id]) db.uiLayout.screens[id]={components:[]};
}
let layoutEditorState={screen:'home',selected:null};
function currentLayoutComponents(){ensureUILayout();return db.uiLayout.screens[layoutEditorState.screen].components;}
function selectedLayoutComponent(){return currentLayoutComponents().find(x=>x.id===layoutEditorState.selected)||null;}
function hexToRgba(hex,alpha=1){const h=String(hex||'').trim();if(!/^#[0-9a-fA-F]{6}$/.test(h))return `rgba(107,125,101,${alpha})`;const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return `rgba(${r},${g},${b},${Math.max(0,Math.min(1,Number(alpha)))})`}
function visualEffectsHTML(c){const st=c.style||{};const mode=st.backgroundMode||'solid';const opacity=Math.max(0,Math.min(1,Number(st.backgroundOpacity??1)));let img='';if(mode==='image'&&st.backgroundImage){img=`<img class="visual-bg-img" src="${esc(st.backgroundImage)}" style="opacity:${opacity};object-fit:${esc(st.imageFit||'cover')};">`;}let overlay='';const ov=st.overlayMode||'none';const oo=Math.max(0,Math.min(1,Number(st.overlayOpacity??0.35)));if(ov==='solid'){overlay=`<div class="visual-bg-overlay" style="background:${esc(st.overlayColor||'#000000')};opacity:${oo};"></div>`;}else if(ov==='gradient'){const c1=st.overlayStart||'#000000';const c2=st.overlayEnd||'transparent';const d=st.overlayDirection||'to bottom';overlay=`<div class="visual-bg-overlay" style="background:linear-gradient(${d},${c1},${c2});opacity:${oo};"></div>`;}let fade='';const fd=st.fade||'none';if(fd!=='none'){const edge=Math.max(5,Math.min(80,Number(st.fadeSize??35)));let mask='';if(fd==='bottom')mask=`linear-gradient(to bottom,#000 0%,#000 ${100-edge}%,transparent 100%)`;else if(fd==='top')mask=`linear-gradient(to bottom,transparent 0%,#000 ${edge}%,#000 100%)`;else if(fd==='left')mask=`linear-gradient(to right,transparent 0%,#000 ${edge}%,#000 100%)`;else if(fd==='right')mask=`linear-gradient(to right,#000 0%,#000 ${100-edge}%,transparent 100%)`;else if(fd==='vertical')mask=`linear-gradient(to bottom,transparent 0%,#000 ${edge}%,#000 ${100-edge}%,transparent 100%)`;else if(fd==='horizontal')mask=`linear-gradient(to right,transparent 0%,#000 ${edge}%,#000 ${100-edge}%,transparent 100%)`;fade=`style="-webkit-mask-image:${mask};mask-image:${mask};"`;}return `<div class="visual-bg" ${fade}>${img}${overlay}</div>`}
function layoutNodeStyle(c){const st=c.style||{};const bs=st.borderStyle||'none';const bw=bs==='none'?0:Math.max(0,Number(st.borderWidth??1));const bc=st.borderColor||'#6b7d65';const bo=Math.max(0,Math.min(1,Number(st.borderOpacity??1)));const mode=st.backgroundMode||'solid';let bg=mode==='image'?'transparent':esc(st.background||'#fff');if(mode==='gradient'){const g1=st.gradientStart||'#ffffff';const g2=st.gradientEnd||'#e6ede4';const gd=st.gradientDirection||'to bottom';bg=`linear-gradient(${esc(gd)},${esc(g1)},${esc(g2)})`;}const border=bs==='none'?'none':`${bw}px ${esc(bs)} ${hexToRgba(bc,bo)}`;return `left:${+c.x||0}px;top:${+c.y||0}px;width:${+c.w||120}px;height:${+c.h||60}px;background:${bg};color:${esc(st.color||'#292c2a')};border-radius:${+st.radius||0}px;border:${border};font-size:${+st.fontSize||14}px;font-weight:${+st.fontWeight||500};opacity:${c.visible===false?0.35:1};overflow:hidden;`}
function layoutNodeContent(c){return `${visualEffectsHTML(c)}<div class="layout-node-text">${esc(c.text||c.label||c.type)}</div><span class="resize"></span>`}

function deleteLayoutComponent(){const comps=currentLayoutComponents();const i=comps.findIndex(x=>x.id===layoutEditorState.selected);if(i<0)return;if(confirm('Eliminar este componente do ecrã?')){comps.splice(i,1);layoutEditorState.selected=null;saveLayoutLocal();render()}}

function updateSelectedLayout(field,value){const c=selectedLayoutComponent();if(!c)return;if(field.startsWith('style.')){const k=field.slice(6);c.style=c.style||{};const numeric=['radius','fontSize','fontWeight','backgroundOpacity','borderWidth','borderOpacity','overlayOpacity','fadeSize'];c.style[k]=numeric.includes(k)?Number(value):value}else if(['x','y','w','h'].includes(field)){const n=Number(value);c[field]=Number.isFinite(n)?n:0}else if(field==='visible')c.visible=!!value;else c[field]=value;saveLayoutLocal();updateLayoutPreview(c);if(field==='style.backgroundMode'||field==='style.borderStyle'||field==='style.overlayMode'||field==='style.fade'||field==='style.imageFit')render()}
function updateLayoutPreview(c){const node=document.querySelector(`[data-layout-id="${c.id}"]`);if(!node)return;node.setAttribute('style',layoutNodeStyle(c));node.style.display=c.visible===false?'none':'';node.innerHTML=layoutNodeContent(c);node.classList.toggle('selected',layoutEditorState.selected===c.id);}
function visualField(c,label,field,type='text'){const v=field.startsWith('style.')?(c.style||{})[field.slice(6)]:c[field];return `<div class="field"><label>${label}</label><input type="${type==='number'?'number':'text'}" value="${esc(v??'')}" oninput="updateSelectedLayout('${field}',this.value)"></div>`}
function visualLayout(){ensureUILayout();const comps=currentLayoutComponents();const sel=selectedLayoutComponent();const tabs=LAYOUT_SCREENS.map(([id,label])=>`<button class="screen-tab ${layoutEditorState.screen===id?'active':''}" onclick="layoutEditorState.screen='${id}';layoutEditorState.selected=null;render()">${label}</button>`).join('');const list=comps.map(c=>`<div class="component-item ${sel?.id===c.id?'active':''}"><button style="text-align:left" onclick="selectLayout('${c.id}')">${esc(c.label||c.type)}<div class="muted" style="font-size:11px">${esc(c.type)}</div></button><button onclick="selectLayout('${c.id}')">✎</button></div>`).join('');const nodes=comps.filter(c=>c.visible!==false).map(c=>`<div class="layout-node ${sel?.id===c.id?'selected':''}" data-layout-id="${esc(c.id)}" style="${layoutNodeStyle(c)}" onpointerdown="layoutPointerDown(event,'${c.id}')">${layoutNodeContent(c)}</div>`).join('');let inspector=`<h3>Propriedades</h3><p class="layout-hint">Seleciona um objeto no canvas ou na árvore para editar as suas propriedades.</p>`;if(sel){const s=sel.style||{};const mode=s.backgroundMode||'solid';const ov=s.overlayMode||'none';const fade=s.fade||'none';inspector=`<h3>Propriedades</h3>${visualField(sel,'Nome','label')}${visualField(sel,'Texto','text')}<div class="inspector-grid">${visualField(sel,'X','x','number')}${visualField(sel,'Y','y','number')}${visualField(sel,'Largura','w','number')}${visualField(sel,'Altura','h','number')}${visualField(sel,'Raio','style.radius','number')}${visualField(sel,'Tamanho letra','style.fontSize','number')}</div><div class="inspector-section"><h3>Fundo do objeto</h3><div class="field"><label>Tipo</label><select onchange="updateSelectedLayout('style.backgroundMode',this.value)"><option value="solid" ${mode==='solid'?'selected':''}>Cor sólida</option><option value="image" ${mode==='image'?'selected':''}>Imagem</option><option value="gradient" ${mode==='gradient'?'selected':''}>Gradiente</option></select></div><div class="formgrid"><div class="field"><label>Cor de fundo</label><input type="color" value="${/^#[0-9a-fA-F]{6}$/.test(s.background||'')?s.background:'#ffffff'}" oninput="updateSelectedLayout('style.background',this.value)"></div><div class="field"><label>Cor do texto</label><input type="color" value="${/^#[0-9a-fA-F]{6}$/.test(s.color||'')?s.color:'#292c2a'}" oninput="updateSelectedLayout('style.color',this.value)"></div></div>${mode==='image'?`<div class="field"><label>URL da imagem</label><input value="${esc(s.backgroundImage||'')}" placeholder="https://..." oninput="updateSelectedLayout('style.backgroundImage',this.value)"></div><div class="formgrid"><div class="field"><label>Opacidade da imagem</label><input type="number" min="0" max="1" step="0.05" value="${s.backgroundOpacity??1}" oninput="updateSelectedLayout('style.backgroundOpacity',this.value)"></div><div class="field"><label>Ajuste</label><select onchange="updateSelectedLayout('style.imageFit',this.value)"><option value="cover" ${(s.imageFit||'cover')==='cover'?'selected':''}>Preencher</option><option value="contain" ${s.imageFit==='contain'?'selected':''}>Conter</option><option value="fill" ${s.imageFit==='fill'?'selected':''}>Esticar</option></select></div></div>`:''}${mode==='gradient'?`<div class="formgrid"><div class="field"><label>Cor inicial</label><input type="color" value="${s.gradientStart||'#ffffff'}" oninput="updateSelectedLayout('style.gradientStart',this.value)"></div><div class="field"><label>Cor final</label><input type="color" value="${s.gradientEnd||'#e6ede4'}" oninput="updateSelectedLayout('style.gradientEnd',this.value)"></div></div><div class="field"><label>Direção</label><select onchange="updateSelectedLayout('style.gradientDirection',this.value)"><option>to bottom</option><option>to right</option><option>to bottom right</option><option>to top</option><option>to left</option></select></div>`:''}</div><div class="inspector-section"><h3>Contorno do objeto</h3><div class="field"><label>Tipo de contorno</label><select onchange="updateSelectedLayout('style.borderStyle',this.value)"><option value="none" ${(!s.borderStyle||s.borderStyle==='none')?'selected':''}>Sem contorno</option><option value="solid" ${s.borderStyle==='solid'?'selected':''}>Sólido</option><option value="dashed" ${s.borderStyle==='dashed'?'selected':''}>Tracejado</option><option value="dotted" ${s.borderStyle==='dotted'?'selected':''}>Pontilhado</option><option value="double" ${s.borderStyle==='double'?'selected':''}>Duplo</option><option value="groove" ${s.borderStyle==='groove'?'selected':''}>Entalhado (groove)</option><option value="ridge" ${s.borderStyle==='ridge'?'selected':''}>Relevo (ridge)</option><option value="inset" ${s.borderStyle==='inset'?'selected':''}>Interior (inset)</option><option value="outset" ${s.borderStyle==='outset'?'selected':''}>Exterior (outset)</option></select></div>${s.borderStyle&&s.borderStyle!=='none'?`<div class="formgrid"><div class="field"><label>Espessura (px)</label><input type="number" min="0" max="20" step="1" value="${s.borderWidth??1}" oninput="updateSelectedLayout('style.borderWidth',this.value)"></div><div class="field"><label>Cor</label><input type="color" value="${s.borderColor||'#6b7d65'}" oninput="updateSelectedLayout('style.borderColor',this.value)"></div></div><div class="field"><label>Opacidade do contorno</label><input type="number" min="0" max="1" step="0.05" value="${s.borderOpacity??1}" oninput="updateSelectedLayout('style.borderOpacity',this.value)"></div>`:''}<p class="visual-effect-help">O contorno pode ser aplicado a botões, imagens, cartões, textos, secções, listas, cabeçalhos e navegação.</p></div><div class="inspector-section"><h3>Transparência e desvanecimento</h3><div class="field"><label>Sobreposição</label><select onchange="updateSelectedLayout('style.overlayMode',this.value)"><option value="none" ${ov==='none'?'selected':''}>Nenhuma</option><option value="solid" ${ov==='solid'?'selected':''}>Cor sólida</option><option value="gradient" ${ov==='gradient'?'selected':''}>Gradiente: sólido → transparente</option></select></div>${ov==='solid'?`<div class="formgrid"><div class="field"><label>Cor</label><input type="color" value="${s.overlayColor||'#000000'}" oninput="updateSelectedLayout('style.overlayColor',this.value)"></div><div class="field"><label>Opacidade</label><input type="number" min="0" max="1" step="0.05" value="${s.overlayOpacity??0.35}" oninput="updateSelectedLayout('style.overlayOpacity',this.value)"></div></div>`:''}${ov==='gradient'?`<div class="formgrid"><div class="field"><label>Parte sólida</label><input type="color" value="${s.overlayStart||'#000000'}" oninput="updateSelectedLayout('style.overlayStart',this.value)"></div><div class="field"><label>Parte final</label><select onchange="updateSelectedLayout('style.overlayEnd',this.value)"><option value="transparent" ${(!s.overlayEnd||s.overlayEnd==='transparent')?'selected':''}>Transparente</option><option value="#ffffff">Branco</option><option value="#000000">Preto</option></select></div></div><div class="formgrid"><div class="field"><label>Direção</label><select onchange="updateSelectedLayout('style.overlayDirection',this.value)"><option>to bottom</option><option>to top</option><option>to right</option><option>to left</option></select></div><div class="field"><label>Intensidade</label><input type="number" min="0" max="1" step="0.05" value="${s.overlayOpacity??0.35}" oninput="updateSelectedLayout('style.overlayOpacity',this.value)"></div></div>`:''}<div class="field"><label>Desvanecimento da imagem</label><select onchange="updateSelectedLayout('style.fade',this.value)"><option value="none" ${fade==='none'?'selected':''}>Nenhum</option><option value="top" ${fade==='top'?'selected':''}>De cima</option><option value="bottom" ${fade==='bottom'?'selected':''}>De baixo</option><option value="left" ${fade==='left'?'selected':''}>Da esquerda</option><option value="right" ${fade==='right'?'selected':''}>Da direita</option><option value="vertical" ${fade==='vertical'?'selected':''}>Dos dois lados verticais</option><option value="horizontal" ${fade==='horizontal'?'selected':''}>Dos dois lados horizontais</option></select></div>${fade!=='none'?`<div class="field"><label>Extensão do desvanecimento (%)</label><input type="number" min="5" max="80" value="${s.fadeSize??35}" oninput="updateSelectedLayout('style.fadeSize',this.value)"></div>`:''}<p class="visual-effect-help">Disponível para todos os objetos: botões, cartões, imagens, textos, secções, listas, cabeçalhos e navegação.</p></div><label class="check"><input type="checkbox" ${sel.visible!==false?'checked':''} onchange="updateSelectedLayout('visible',this.checked)"> Visível</label><div class="layout-actions"><button class="btn secondary" onclick="moveLayout(-1)">↑ Subir</button><button class="btn secondary" onclick="moveLayout(1)">↓ Descer</button><button class="btn danger" onclick="deleteLayoutComponent()">Eliminar</button></div>`}return header('Editor Visual v7','Controla a composição de cada ecrã da Lumina — edição visual direta',`<button class="btn secondary" onclick="downloadJSON()">Exportar JSON</button><button class="btn" onclick="publishCloud()">Publicar</button>`)+`<div class="card" style="margin-bottom:14px"><div class="screen-tabs">${tabs}</div><div class="layout-actions"><button class="btn secondary" onclick="addLayoutComponent('button')">+ Botão</button><button class="btn secondary" onclick="addLayoutComponent('text')">+ Texto</button><button class="btn secondary" onclick="addLayoutComponent('card')">+ Cartão</button><button class="btn secondary" onclick="addLayoutComponent('image')">+ Imagem</button><button class="btn secondary" onclick="addLayoutComponent('section')">+ Secção</button><button class="btn secondary" onclick="addLayoutComponent('list')">+ Lista</button></div></div><div class="layout-editor"><div class="layout-panel"><h3>Objetos do ecrã</h3><div class="component-list">${list||'<div class="empty">Sem objetos.</div>'}</div><p class="layout-hint" style="margin-top:12px">Seleciona, arrasta e redimensiona os objetos no preview. A ordem pode ser alterada com ↑ e ↓.</p></div><div class="canvas-wrap"><div class="layout-canvas" id="layoutCanvas"><div class="canvas-grid"></div>${nodes}</div></div><div class="layout-panel inspector">${inspector}</div></div>`}

let layoutDrag=null;
function layoutPointerDown(e,id){if(e.button!==undefined&&e.button!==0)return;const c=currentLayoutComponents().find(x=>x.id===id);if(!c)return;layoutEditorState.selected=id;const canvas=document.getElementById('layoutCanvas');const r=canvas.getBoundingClientRect();const node=e.currentTarget;const nr=node.getBoundingClientRect();layoutDrag={id,startX:e.clientX,startY:e.clientY,origX:c.x,origY:c.y,origW:c.w,origH:c.h,resize:e.target.classList.contains('resize'),canvas:r};node.setPointerCapture?.(e.pointerId);const move=(ev)=>{if(!layoutDrag)return;const dx=ev.clientX-layoutDrag.startX,dy=ev.clientY-layoutDrag.startY;if(layoutDrag.resize){c.w=Math.max(40,Math.min(336,layoutDrag.origW+dx));c.h=Math.max(30,Math.min(600,layoutDrag.origH+dy))}else{c.x=Math.max(0,Math.min(360-c.w,layoutDrag.origX+dx));c.y=Math.max(0,Math.min(640-c.h,layoutDrag.origY+dy))}node.style.left=c.x+'px';node.style.top=c.y+'px';node.style.width=c.w+'px';node.style.height=c.h+'px'};const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);saveLayoutLocal();render()};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);e.stopPropagation();}
function legacyLayoutSettings(){return header('Layout','Define a composição responsiva da app',`<button class="btn" onclick="saveLayout()">Guardar layout</button>`)+`<div class="card"><div class="formgrid"><div class="field"><label>Largura máxima de conteúdo (dp)</label><input id="contentWidth" type="number" value="${db.layout.home.contentWidth}"></div><div class="field"><label>Colunas de áudios em telemóvel</label><select id="phoneCols"><option ${db.layout.home.audioColumnsPhone==1?'selected':''}>1</option><option ${db.layout.home.audioColumnsPhone==2?'selected':''}>2</option></select></div><div class="field"><label>Colunas em tablet</label><select id="tabletCols"><option ${db.layout.home.audioColumnsTablet==1?'selected':''}>1</option><option ${db.layout.home.audioColumnsTablet==2?'selected':''}>2</option><option ${db.layout.home.audioColumnsTablet==3?'selected':''}>3</option></select></div><div class="field"><label>Raio dos cartões</label><input id="radius" type="number" value="${db.layout.cards.radius}"></div></div><label class="check"><input id="showMood" type="checkbox" ${db.layout.home.showMood?'checked':''}> Mostrar estado emocional</label><label class="check"><input id="showGreeting" type="checkbox" ${db.layout.home.showGreeting?'checked':''}> Mostrar saudação</label></div><div class="grid" style="margin-top:14px"><div class="card"><b>Telemóvel</b><div class="phone" style="margin-top:12px"><div class="phonebar"></div><div class="phonebody"><h3>Início</h3><div style="display:grid;grid-template-columns:repeat(${db.layout.home.audioColumnsPhone},1fr);gap:8px"><div class="card">Áudio</div><div class="card">Áudio</div></div></div></div></div><div class="card"><b>Tablet / ecrã largo</b><p class="muted">A app nativa adapta a navegação para rail lateral e usa o número de colunas configurado acima.</p></div></div>`}
function saveLayout(){db.layout.home.contentWidth=+document.querySelector('#contentWidth').value;db.layout.home.audioColumnsPhone=+document.querySelector('#phoneCols').value;db.layout.home.audioColumnsTablet=+document.querySelector('#tabletCols').value;db.layout.cards.radius=+document.querySelector('#radius').value;db.layout.home.showMood=document.querySelector('#showMood').checked;db.layout.home.showGreeting=document.querySelector('#showGreeting').checked;save()}
function publish(){return header('Publicar','Publicação global da Lumina',`<button class="btn secondary" onclick="downloadJSON()">Descarregar JSON</button><button class="btn" onclick="publishCloud()">Publicar para todas as instalações</button>`)+`<div class="grid"><div class="card"><b>Cloud</b><p class="muted">${cloud.user?'Ligado e autenticado.':'Ainda não ligado.'}</p><span class="pill">${cloud.user?'ONLINE':'LOCAL'}</span></div><div class="card"><b>Versão editorial</b><div class="stat">${db.version||1}</div><div class="muted">${esc(db.updatedAt||'Rascunho local')}</div></div><div class="card"><b>Distribuição</b><p class="muted">Android/iPhone consultam o catálogo publicado. Conteúdo e media não exigem novo APK.</p></div></div><div class="card" style="margin-top:14px"><h3>Fluxo</h3><ol><li>Editar no Studio.</li><li>Pré-visualizar.</li><li>Publicar no backend.</li><li>As apps sincronizam automaticamente.</li></ol><p class="muted">Uma nova versão da app só é necessária para novas funcionalidades nativas ou alterações de código.</p></div>`}function media(){return header('Media','Biblioteca central de imagens e áudios',`<button class="btn secondary" onclick="go('publish')">Publicar</button>`)+`<div class="card"><p><b>Upload para o Lumina Cloud</b></p><p class="muted">Os ficheiros carregados para o bucket central podem ser usados por todas as instalações.</p><input id="mediaFile" type="file" accept="audio/*,image/*" onchange="handleMediaUpload(event)"><div id="mediaResult" class="muted" style="margin-top:10px"></div></div>`}
async function handleMediaUpload(e){const f=e.target.files?.[0];if(!f)return;const url=await uploadMedia(f);if(url){document.getElementById('mediaResult').innerHTML=`URL publicada: <input value="${esc(url)}" readonly onclick="this.select()">`;}}function pages(){return listSection('pages','Conteúdos','Páginas e blocos editoriais',db.pages)}
function events(){return listSection('events','Eventos','Eventos, workshops e retiros',db.events)}
function downloadJSON(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lumina_content.json';a.click();URL.revokeObjectURL(a.href)}
function downloadZipInfo(){let text='LUMINA STUDIO — PUBLICAÇÃO\n\n1. Exportar lumina_content.json.\n2. Colocar o JSON no backend/Storage.\n3. Configurar CONTENT_URL na app nativa.\n4. A app usa o conteúdo remoto quando disponível e o conteúdo embutido como fallback.';let b=new Blob([text],{type:'text/plain'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='PUBLICAR_LUMINA.txt';a.click()}
function render(){let content=state.edit?editor():state.section==='dashboard'?dashboard():state.section==='audios'?listSection('audios','Áudios gratuitos','Gerir catálogo, disponibilidade e URLs de áudio',db.audios):state.section==='courses'?listSection('courses','Cursos','Gerir cursos e preços',db.courses):state.section==='journeys'?listSection('journeys','Jornadas','Gerir jornadas e preços',db.journeys):state.section==='meditations'?listSection('dailyMeditations','Meditações diárias','Planear e publicar a meditação de cada dia',db.dailyMeditations||[]):state.section==='pages'?pages():state.section==='events'?events():state.section==='layout'?visualLayout():state.section==='media'?media():publish();document.getElementById('root').innerHTML=shell(content)}
ensureUILayout();
// Editor Visual é a única implementação ativa do menu Layout.
render();
initCloud();
</script></body></html>
